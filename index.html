<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قدّها | QADHA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--p:#6554C0;--deep:#25213F;--mint:#2FA88A;--bg:#F8F7FC;--sf:#fff;--tx:#27243A;--mu:#6E6A82;--wn:#C98414;--dn:#D45A5A;--ln:#E4E1F0;--pt:#EEEAFB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:#A78BFA;--deep:#1A1730;--mint:#65C9AE;--bg:#15132A;--sf:#201D3A;--tx:#F1EFFA;--mu:#A29EBA;--wn:#F2AE54;--dn:#E97878;--ln:#33305A;--pt:#2B2750}}
:root[data-theme="dark"]{--p:#A78BFA;--deep:#1A1730;--mint:#65C9AE;--bg:#15132A;--sf:#201D3A;--tx:#F1EFFA;--mu:#A29EBA;--wn:#F2AE54;--dn:#E97878;--ln:#33305A;--pt:#2B2750}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,system-ui,sans-serif;line-height:1.7;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{margin:0 0 8px;line-height:1.35}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 18px;background:var(--p);color:#fff;cursor:pointer;width:100%;min-height:48px}
.btn:hover{filter:brightness(1.08)}.btn.g{background:var(--pt);color:var(--p)}.btn:focus-visible,.opt:focus-visible,.nav button:focus-visible{outline:3px solid var(--wn);outline-offset:2px}
.hero{background:var(--deep);color:#fff;border-radius:24px;padding:28px 20px;text-align:center;margin-top:8px}
.hero h1{font-size:3rem;margin:0}.hero .tag{font-size:1.4rem;font-weight:800;color:var(--mint)}
.sprout{width:120px;height:120px;margin:0 auto 8px;display:block}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);margin:8px 0}
.bar{height:10px;background:var(--pt);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .5s}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.chip{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--pt);color:var(--p);font-weight:600}
.grid{display:grid;gap:12px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.gc{cursor:pointer}.gc .ic{font-size:1.8rem}
.opt{display:block;width:100%;text-align:start;font:inherit;background:var(--sf);color:var(--tx);border:2px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--p)}.opt.best{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 15%,var(--sf))}.opt.ok{border-color:var(--wn)}.opt.bad{border-color:var(--dn);background:color-mix(in srgb,var(--dn) 12%,var(--sf))}
.fb{border-radius:12px;padding:12px;background:var(--pt);margin:8px 0}
.msg{border:1px dashed var(--mu);border-radius:12px;padding:12px;background:var(--bg);margin:8px 0}
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;max-width:200px;font:inherit;background:none;border:0;color:var(--mu);padding:8px;cursor:pointer;font-weight:600}.nav button.on{color:var(--p)}
.big{font-size:1.6rem;font-weight:800}.mu{color:var(--mu);font-size:.9rem}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:30%;text-align:center;margin:6px 1%;font-size:.85rem;vertical-align:top}
.badge span{font-size:2rem;width:56px;height:56px;border-radius:50%;background:var(--pt);display:flex;align-items:center;justify-content:center}.badge.off{opacity:.35;filter:grayscale(1)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;max-width:420px;margin:auto;background:var(--deep);color:#fff;padding:12px 16px;border-radius:12px;z-index:9;font-weight:600;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav" hidden></nav>
<script>
"use strict";
const KEY="qadha_v1",LV=[["مبتدئة",0],["مستكشفة",60],["واعية مالياً",150],["مخططة ذكية",280],["قدّها!",450]];
const BADGES=[["first","🌱","أول خطوة"],["budget","📊","خبيرة الميزانية"],["eye","🦅","عين الصقر"],["saver","👑","ملكة الادخار"],["daily","🏆","بطلة التحديات"]];
const dflt=()=>({name:"",goal:"",xp:0,done:{},badges:[],ans:0,right:0,daily:"",streak:1,avatar:"🙂"});
let S=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&typeof d==="object"?Object.assign(dflt(),d):dflt()}catch(e){return dflt()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),app=$("#app");
const lvl=()=>{let i=0;LV.forEach((l,k)=>{if(S.xp>=l[1])i=k});return i};
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function addXP(n){const b=lvl();S.xp+=n;save();if(lvl()>b)toast("مستوى جديد: "+LV[lvl()][0]+" 🎉")}
function unlock(id){if(!S.badges.includes(id)){S.badges.push(id);save();toast("وسام جديد: "+BADGES.find(b=>b[0]===id)[2])}}
const sc=(h,q,o)=>({h,q,o});
/* Game data. Option = [label, money delta, points(0-2), why]. All money is fictional. */
const GAMES={
g1:{t:"تحدي آخر الشهر",ic:"💼",d:"ميزانية",diff:"سهل",min:"4 د",desc:"وزّعي ميزانية افتراضية وواجهي مفاجآت الشهر.",bal:5000,unit:"ج",
sc:[
sc("مواصلات طارئة","المواصلات زادت وعندك مشاوير مهمة الأسبوع ده.",[["أركب أوبر كل يوم",-600,0,"مريح لكنه بياكل جزء كبير من الميزانية."],["أتفق مع زميلة نتشارك المشوار",-250,2,"قللتي التكلفة من غير ما تضحي بالمشاوير المهمة."],["ألغي المشاوير",0,1,"وفّرتي، لكن ممكن تضيعي فرص مهمة."]]),
sc("خروجة غالية","صحابك عازمينك على خروجة هتكلف 700 جنيه.",[["أروح وأصرف براحتي",-700,0,"الاستمتاع مهم، بس من غير حدود بيضغط على باقي الشهر."],["أروح بحد أقصى 250 وأقول لهم بصراحة",-250,2,"وازنتي بين علاقاتك وميزانيتك."],["أرفض كل الخروجات",0,1,"الادخار مهم، لكن التوازن أفضل من الحرمان الكامل."]]),
sc("حاجة أساسية","سخان المياه باظ ومحتاجة بديل ضروري.",[["أشتري الأرخص من أي مكان",-900,1,"يمكن يوفر، بس الجودة والضمان مهمين."],["أقارن 3 أماكن وأشتري المناسب",-1100,2,"المقارنة بتجنبك الندم، والحاجة الأساسية أولوية."],["أأجّل الشراء",0,0,"ده احتياج أساسي، تأجيله مش قرار ذكي."]]),
sc("خصم مغري","فيه تخفيض 50% على فستان مش محتاجاه.",[["أشتريه، الخصم فرصة",-800,0,"الخصم على حاجة مش محتاجاها مش توفير."],["أحطه في قائمة رغبات وأستنى 3 أيام",0,2,"فترة التفكير بتفرّق بين الاحتياج والاندفاع."],["أشتريه وأعوّض من الأكل",-800,0,"التعويض من الأساسيات قرار غير متوازن."]]),
sc("طوارئ","محتاجة تعملي كشف طبي مفاجئ تكلفته 600 جنيه.",[["أسحب من احتياطي الطوارئ",-600,2,"ده بالظبط سبب وجود الاحتياطي."],["أستلف من صاحبتي",-600,1,"حل ممكن، لكن الاحتياطي أفضل."],["أتجاهل الأمر",0,0,"الصحة أولوية، والتأجيل ممكن يكلف أكتر."]])]},
g2:{t:"صيدة النصاب",ic:"🕵️",d:"أمان",diff:"متوسط",min:"4 د",desc:"اكتشفي الرسائل والعروض المشبوهة.",
sc:[
{h:"رسالة SMS: «خدمة المحفظة»",q:"محفظتك هتتوقف خلال ساعة! ادخلي على الرابط وأكدي بياناتك الآن.",a:1,w:"استعجال وتهديد ورابط غريب. ما تضغطيش، وادخلي على التطبيق الرسمي بنفسك."},
{h:"مكالمة: «موظف أمن البنك»",q:"محتاج كود OTP اللي وصلك عشان نلغي عملية مشبوهة.",a:1,w:"كود OTP ما بيتشاركش مع أي حد أبداً، حتى لو قال إنه من البنك. اقفلي واتصلي بالرقم الرسمي."},
{h:"إعلان على فيسبوك",q:"استثمري 1000 جنيه واكسبي 50% شهرياً مضمونة 100%!",a:1,w:"مفيش ربح مضمون. العوائد العالية المضمونة علامة نصب. اتأكدي من الجهة الرسمية."},
{h:"رسالة واتساب: رقم مجهول",q:"مبروك! كسبتي جايزة 10,000 جنيه. ادخلي الرابط وسجلي بيانات كارتك.",a:1,w:"جوايز من غير مسابقة اشتركتي فيها = احتيال. بيانات الكارت ما بتتشاركش."},
{h:"إشعار من تطبيق البنك الرسمي",q:"تم تسجيل دخول جديد لحسابك. لو مش إنتي، افتحي التطبيق بنفسك وغيري الباسورد.",a:2,w:"الرسالة ما طلبتش بيانات ولا رابط. الأفضل برضه تفتحي التطبيق بنفسك وتتأكدي."}]},
g3:{t:"ازرعي هدفك",ic:"🌱",d:"ادخار",diff:"سهل",min:"4 د",desc:"خططي لهدف (لابتوب 20,000 ج) وواجهي مفاجآت.",bal:4000,goal:20000,monthly:1500,unit:"ج",
sc:[
sc("مصروف مفاجئ","اتصرفتي 500 جنيه على إصلاح الموبايل.",[["أوقف الادخار الشهر ده",-500,0,"الانقطاع بيكسر العادة."],["أسحب 500 وأكمل ادخار الشهر",-500,2,"المرونة مع الاستمرار أحسن من التوقف."],["أستلف وأحافظ على المبلغ",0,1,"الاستلاف بيعمل التزام جديد."]]),
sc("فلوس زيادة","جاتلك 1000 جنيه هدية.",[["أضيف نصفها للهدف",500,2,"بتقرّبي من هدفك وتحتفظي بجزء للاستمتاع."],["أصرفها كلها",0,0,"فرصة ضاعت للاقتراب من الهدف."],["أحطها كلها في الهدف",1000,1,"ممتاز للهدف، لكن شوية مرونة بتساعد."]]),
sc("السعر زاد","سعر اللابتوب زاد 2000 جنيه.",[["أزوّد مبلغ الادخار الشهري شوية وأمدد المدة",0,2,"بتعدلي الخطة بدل ما تتخلي عن الهدف."],["أتخلى عن الهدف",0,0,"التعديل أحسن من الاستسلام."],["أتجاهل وأكمل زي ما أنا",0,1,"الهدف اتغير والخطة لازم تتحدث."]]),
sc("شهر فاتك","ما قدرتيش تدّخري الشهر ده.",[["أعوّض في الشهور الجاية بالتدريج",0,2,"التعويض الواقعي بيحافظ على الاستمرارية."],["أعوّض كله الشهر الجاي",0,1,"ممكن يضغط على ميزانيتك."],["أنسى الخطة",0,0,"الاستمرار أهم من الكمال."]]),
sc("محطة إنجاز","وصلتي لـ 50% من هدفك!",[["أكافئ نفسي بحاجة صغيرة وأكمل",300,2,"الاحتفال الصغير بيدعم الاستمرار."],["أوقف لأني قربت",0,0,"لسه فاضل نص الطريق."],["أبدأ هدف تاني وأسيب الأول",0,0,"الأفضل تخلصي واحد قبل ما تبدأي غيره."]])]}};
GAMES.g2.sc=GAMES.g2.sc.map(s=>({h:s.h,q:s.q,o:["الرسالة آمنة","الرسالة مشبوهة","لازم أتأكد من المصدر الرسمي"].map((l,i)=>[l,0,i===s.a?2:(i===2?1:0),s.w])}));
let G=null;
function go(v){window.scrollTo(0,0);({welcome,onboard,home,achieve,profile})[v]()}
function setNav(on,cur){const n=$("#nav");n.hidden=!on;if(!on)return;n.innerHTML=[["home","🏠","الرئيسية"],["achieve","⭐","إنجازاتي"],["profile","👤","حسابي"]].map(x=>`<button class="${x[0]===cur?"on":""}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join("")}
function welcome(){setNav(false);app.innerHTML=`<div class="hero"><svg class="sprout" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="#6554C0"/><path d="M60 92V52" stroke="#65C9AE" stroke-width="7" stroke-linecap="round"/><path d="M60 62C40 62 34 48 36 38c20 0 26 10 24 24Z" fill="#65C9AE"/><path d="M60 52c0-16 10-24 28-24 0 16-10 24-28 24Z" fill="#A78BFA"/></svg><h1>قدّها</h1><div class="tag">فلوسك قرارك</div><p>اتعلمي باللعب، وخدي قرارات مالية أذكى. ٣ ألعاب بمواقف من حياتك اليومية، من غير أي فلوس حقيقية.</p><button class="btn" onclick="go('onboard')">ابدئي رحلتك</button><br><br><button class="btn g" onclick="document.getElementById('more').hidden=false;this.hidden=true">اعرفي أكتر</button><div id="more" hidden style="text-align:start;margin-top:12px">• ميزانية افتراضية تتعلمي منها الأولويات<br>• تدريب على اكتشاف الاحتيال وحماية الـ OTP<br>• خطة ادخار لهدف حقيقي بحسابات واضحة</div></div><p class="mu" style="text-align:center">قدّها منصة تعليمية تجريبية. المحتوى للتوعية فقط، ولا يمثل نصيحة مالية أو استثمارية.</p>`}
function onboard(){setNav(false);const goals=["تنظيم المصاريف","تعلم الادخار","اكتشاف الاحتيال","فهم الخدمات المالية"];
app.innerHTML=`<div class="card"><h2>أهلاً بيكي في قدّها</h2><p>هتلعبي مواقف مالية، وكل قرار بيديكي نقاط خبرة (XP) وأوسمة. كل خطوة صغيرة بتفرق.</p><label for="nm">اسمك أو لقبك (اختياري)</label><input id="nm" maxlength="20" placeholder="مثلاً: سلمى"><p>عايزة تتعلمي إيه أكتر؟</p>${goals.map(g=>`<button class="opt" onclick="S.goal='${g}';this.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.remove('best'));this.classList.add('best')">${g}</button>`).join("")}<p class="mu">ما بنطلبش أي بيانات شخصية أو بنكية.</p><button class="btn" onclick="S.name=$('#nm').value.trim()||'صاحبة القرار';save();go('home')">يلا نبدأ</button></div>`}
function home(){setNav(true,"home");const l=lvl(),nx=LV[l+1],pc=nx?Math.round((S.xp-LV[l][1])/(nx[1]-LV[l][1])*100):100;
const today=new Date().toDateString(),dd=S.daily===today;
const g3=GAMES.g3,sv=S.done.g3?S.done.g3.bal:g3.bal;
app.innerHTML=`<div class="row"><div><div class="mu">أهلاً بيكي</div><h2>${esc(S.name||"صاحبة القرار")} ${S.avatar}</h2></div><span class="chip">🔥 ${S.streak} يوم</span></div>
<div class="card"><div class="row"><b>المستوى ${l+1}: ${LV[l][0]}</b><span>${S.xp} XP</span></div><div class="bar"><i style="width:${pc}%"></i></div><div class="mu">${nx?`فاضل ${nx[1]-S.xp} XP للمستوى «${nx[0]}»`:"وصلتي لأعلى مستوى!"} • ${S.badges.length} أوسمة</div></div>
<div class="card" style="border-color:var(--wn)"><b>تحدي النهاردة</b><p>${dd?"خلصتي تحدي النهاردة، شطورة!":"اكتشفي الرسالة المشبوهة: العبي «صيدة النصاب» وخدي +20 XP."}</p>${dd?"":`<button class="btn" onclick="start('g2',true)">ابدئي التحدي</button>`}</div>
<h3>اختاري لعبتك</h3><div class="grid">${Object.entries(GAMES).map(([k,g])=>`<div class="card gc"><div class="ic">${g.ic}</div><h3>${g.t}</h3><p class="mu">${g.desc}</p><span class="chip">${g.diff}</span> <span class="chip">${g.min}</span><div class="bar" style="margin:10px 0"><i style="width:${S.done[k]?100:0}%"></i></div><button class="btn" onclick="start('${k}')">${S.done[k]?"العبي تاني":"ابدئي"}</button></div>`).join("")}</div>
<div class="card"><b>هدفي: لابتوب 20,000 ج (افتراضي)</b><div class="bar" style="margin:8px 0"><i style="width:${Math.min(100,sv/g3.goal*100)}%"></i></div><div class="mu">${sv.toLocaleString("ar-EG")} من ${g3.goal.toLocaleString("ar-EG")} ج • بمعدل ${g3.monthly.toLocaleString("ar-EG")} ج/شهر باقي ${Math.max(0,Math.ceil((g3.goal-sv)/g3.monthly))} شهر</div></div>
<p class="mu" style="text-align:center">كل الأرقام خيالية للتجربة. قدّها منصة تعليمية ولا تمثل نصيحة مالية.</p>`}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function start(id,daily){const g=GAMES[id];G={id,i:0,pts:0,bal:g.bal||0,daily:!!daily,rep:!!S.done[id],rec:[]};setNav(false);intro()}
function intro(){const g=GAMES[G.id];app.innerHTML=`<div class="card"><div style="font-size:2.4rem">${g.ic}</div><h2>${g.t}</h2><p>${g.desc}</p><p>${g.sc.length} مواقف، ولكل موقف 3 قرارات. هتشوفي الإجابة والسبب بعد كل اختيار.</p>${G.id==="g1"?`<div class="fb">ميزانية افتراضية للتجربة: 5,000 ج</div>`:""}${G.rep?`<p class="mu">لعبتيها قبل كده، فالنقاط بتتحسب مرة واحدة بس.</p>`:""}<button class="btn" onclick="step()">يلا</button><br><br><button class="btn g" onclick="go('home')">رجوع</button></div>`}
function step(){const g=GAMES[G.id],s=g.sc[G.i];G.lock=false;
app.innerHTML=`<div class="row"><span class="mu">موقف ${G.i+1} من ${g.sc.length}</span><span class="chip">${g.t}</span></div><div class="bar" style="margin:8px 0"><i style="width:${G.i/g.sc.length*100}%"></i></div>${g.bal?`<div class="card"><span class="mu">الرصيد الافتراضي</span> <span class="big">${G.bal.toLocaleString("ar-EG")} ج</span></div>`:""}<div class="card"><h3>${esc(s.h)}</h3><div class="msg">${esc(s.q)}</div>${s.o.map((o,i)=>`<button class="opt" onclick="pick(${i})">${esc(o[0])}</button>`).join("")}<div id="fb"></div></div>`}
function pick(i){if(G.lock)return;G.lock=true;const g=GAMES[G.id],s=g.sc[G.i],o=s.o[i],best=Math.max(...s.o.map(x=>x[2]));
document.querySelectorAll(".opt").forEach((b,k)=>{const p=s.o[k][2];if(k===i)b.classList.add(p===best?"best":p?"ok":"bad");else if(p===best)b.classList.add("best")});
G.pts+=o[2];G.bal+=o[1];if(o[2]===best)G.rec.push(s.h);S.ans++;
const good=o[2]===best;if(good)S.right++;
if(!G.rep&&good)addXP(10);else save();
$("#fb").innerHTML=`<div class="fb"><b>${good?"شطورة! اخترتي الأنسب":o[2]?"قرار معقول، وفيه أفضل منه":"خلينا نفكر فيها سوا"}</b><br>${esc(o[3])}${o[1]?`<br><span class="mu">الأثر: ${o[1]>0?"+":""}${o[1].toLocaleString("ar-EG")} ج</span>`:""}</div><button class="btn" onclick="${G.i+1<g.sc.length?"G.i++;step()":"finish()"}">${G.i+1<g.sc.length?"التالي":"شوفي النتيجة"}</button>`}
function finish(){const g=GAMES[G.id],max=g.sc.length*2,pct=Math.round(G.pts/max*100);
const first=!S.done[G.id];
if(first){addXP(30);S.done[G.id]={pct,bal:G.bal};}else if(pct>(S.done[G.id].pct||0)){S.done[G.id]={pct,bal:G.bal}}
unlock("first");if(G.id==="g1"&&pct>=70)unlock("budget");if(G.id==="g2"&&pct>=80)unlock("eye");if(G.id==="g3")unlock("saver");
if(G.daily&&S.daily!==new Date().toDateString()){S.daily=new Date().toDateString();addXP(20);unlock("daily")}
save();
const tips={g1:["حاجات الأساس الأول، وبعدين الرغبات.","احتياطي الطوارئ بيحميكي من الاستلاف.","التوازن أفضل من الحرمان."],g2:["ما تشاركيش OTP أو الباسورد مع أي حد.","الاستعجال والتهديد علامة احتيال.","اتأكدي من القنوات الرسمية بنفسك."],g3:["الاستمرار أهم من المبلغ.","عدّلي الخطة لما الظروف تتغير.","مفيش ربح مضمون: الادخار عادة مش مكسب."]}[G.id];
const extra=G.id==="g1"?`<p>الرصيد الافتراضي المتبقي: <b>${G.bal.toLocaleString("ar-EG")} ج</b> (${Math.round(G.bal/50)}% من الميزانية)</p>`:G.id==="g3"?`<p>مدخراتك الافتراضية: <b>${G.bal.toLocaleString("ar-EG")} ج</b> (${Math.round(G.bal/g.goal*100)}% من الهدف) • باقي حوالي ${Math.max(0,Math.ceil((g.goal-G.bal)/g.monthly))} شهر بمعدل ${g.monthly.toLocaleString("ar-EG")} ج/شهر</p>`:G.rec.length?`<p>علامات اتعرفتي عليها: ${G.rec.map(esc).join("، ")}</p>`:"";
app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:2.4rem">🎉</div><h2>نتيجتك ${pct}%</h2><div class="bar"><i style="width:${pct}%"></i></div>${extra}<div style="text-align:start"><b>3 أفكار تخليكي تكمّلي:</b><br>${tips.map(t=>"• "+t).join("<br>")}</div><p class="mu">${first?"+30 XP لإنهاء اللعبة":""}</p><button class="btn" onclick="start('${G.id}')">العبي تاني</button><br><br><button class="btn g" onclick="go('home')">رجوع للرئيسية</button></div>`}
function achieve(){setNav(true,"achieve");const l=lvl();
app.innerHTML=`<h2>إنجازاتي</h2><div class="card"><b>المستوى ${l+1}: ${LV[l][0]}</b><div class="mu">${S.xp} XP</div></div><div class="card"><b>الأوسمة</b><br>${BADGES.map(b=>`<div class="badge ${S.badges.includes(b[0])?"":"off"}"><span>${b[1]}</span>${b[2]}</div>`).join("")}</div><div class="card"><b>إحصائياتي</b><br>ألعاب مكتملة: ${Object.keys(S.done).length}/3<br>أسئلة جاوبتيها: ${S.ans}<br>قرارات مناسبة: ${S.right}</div>`}
function profile(){setNav(true,"profile");
app.innerHTML=`<h2>حسابي</h2><div class="card"><label for="nm">اللقب</label><input id="nm" value="${esc(S.name)}" maxlength="20"><div class="row" style="justify-content:flex-start">${["🙂","😎","🦋","🌸","🚀"].map(a=>`<button class="opt" style="width:auto;margin:4px;border-color:${S.avatar===a?"var(--p)":"var(--ln)"}" onclick="S.avatar='${a}';save();profile()" aria-label="أفاتار ${a}">${a}</button>`).join("")}</div><button class="btn" onclick="S.name=$('#nm').value.trim()||S.name;save();toast('اتحفظ');go('home')">حفظ</button></div><div class="card"><b>إعادة التجربة</b><p class="mu">بيمسح كل التقدم ويرجّع التطبيق لنقطة البداية (للعرض أمام اللجنة).</p><button class="btn g" onclick="if(confirm('متأكدة إنك عايزة تمسحي كل التقدم؟')){localStorage.removeItem(KEY);S=dflt();go('welcome')}">إعادة التجربة</button></div><p class="mu">قدّها منصة تعليمية تجريبية. المحتوى للتوعية والتعلم فقط، ولا يمثل نصيحة مالية أو استثمارية أو بديلاً عن الجهات المالية الرسمية.</p>`}
go(S.name?"home":"welcome");
</script>
</body>
</html>
